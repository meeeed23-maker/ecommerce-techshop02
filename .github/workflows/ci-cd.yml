name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Backend Tests
        run: cd backend && mvn test

  build-docker:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t achbanimed/ecommerce-backend:test ./backend
      - name: Build Frontend Image
        run: docker build -t achbanimed/ecommerce-frontend:test ./frontend

  push-docker:
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Backend
        run: |
          docker build -t achbanimed/ecommerce-backend:latest ./backend
          docker push achbanimed/ecommerce-backend:latest
      - name: Build and Push Frontend
        run: |
          docker build -t achbanimed/ecommerce-frontend:latest ./frontend
          docker push achbanimed/ecommerce-frontend:latest
