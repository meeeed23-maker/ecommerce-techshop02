<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-icon">✨</span>
      <h1>Créer un compte</h1>
      <p>Rejoignez TechShop dès maintenant</p>
    </div>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" [(ngModel)]="username" name="username"
          placeholder="Choisissez un identifiant" required class="form-input" />
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="password" name="password"
          placeholder="Au moins 6 caractères" required class="form-input" />
      </div>

      <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="success-msg">{{ successMessage }}</div>

      <button type="submit" [disabled]="isLoading" class="submit-btn">
        {{ isLoading ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="auth-footer">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</div>
